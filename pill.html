<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:"><title>Just Zen pill</title><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2b3640;user-select:none;-webkit-user-select:none}
body[data-theme=dark]{color:#dfe6e0}
#pill{position:absolute;right:6px;top:6px;bottom:6px;width:52px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:26px;background:rgba(255,255,255,.95);border:1px solid rgba(60,70,80,.16);box-shadow:0 18px 40px -22px rgba(15,25,35,.65)}
body[data-theme=dark] #pill{background:rgba(29,34,31,.95);border-color:rgba(255,255,255,.12)}
#pill.drag{-webkit-app-region:drag}
.spot{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 38px;-webkit-app-region:no-drag;cursor:pointer;background:transparent;border:0;padding:0;color:inherit}
.spot:hover{background:rgba(120,140,160,.16)}
.spot.over{background:rgba(66,181,245,.22);box-shadow:inset 0 0 0 1.5px rgba(66,181,245,.65)}
.spot.lifting{opacity:.4}
.spot.above{box-shadow:inset 0 3px 0 -1px #39c7c0}
.spot.below{box-shadow:inset 0 -3px 0 -1px #39c7c0}
#group-name::placeholder{opacity:.6}
.spot img{width:28px;height:28px;border-radius:7px;object-fit:contain;pointer-events:none}
.spot .glyph{font-size:17px;pointer-events:none}
.folder{position:relative}
.folder .stack{width:28px;height:28px;border-radius:9px;background:rgba(120,140,160,.18);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;padding:4px;box-sizing:border-box}
.folder .stack i{display:block;border-radius:2px;background:rgba(90,110,130,.55)}
body[data-theme=dark] .folder .stack i{background:rgba(220,230,220,.5)}
.folder .stack img{width:100%;height:100%;border-radius:2px;object-fit:cover}
.folder-name{font-size:8px;letter-spacing:.3px;text-transform:uppercase;opacity:.65;text-align:center;line-height:1;margin-top:1px}
.kids.over{box-shadow:inset 0 0 0 1.5px rgba(66,181,245,.65)}
.kids{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;margin:2px 0;border-radius:14px;background:rgba(120,140,160,.1)}
.spot small{position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:999px;background:#d9483b;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
#grip{width:22px;height:14px;display:flex;align-items:center;justify-content:center;gap:3px;flex:0 0 14px;-webkit-app-region:drag;cursor:grab;opacity:.5}
#grip i{width:3px;height:3px;border-radius:50%;background:currentColor;display:block}
.rule{width:22px;height:1px;background:rgba(120,140,160,.4);flex:0 0 1px;margin:2px 0}
#tail{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
#group-ask{position:absolute;left:4px;right:4px;bottom:6px;margin:0}
#group-ask[hidden]{display:none}
#group-name{width:100%;font:600 10px -apple-system,BlinkMacSystemFont,sans-serif;padding:7px 6px;border-radius:12px;border:1px solid rgba(60,70,80,.25);background:#fff;color:inherit;text-align:center;-webkit-app-region:no-drag}
body[data-theme=dark] #group-name{background:#202622;border-color:rgba(255,255,255,.18)}
#empty{font-size:9px;text-align:center;opacity:.65;line-height:1.35;padding:6px 6px 2px}
/* With nothing on it yet, the panel stands taller and the ＋ glows so it is obvious where to start. */
body.empty #pill{justify-content:center;gap:12px}
body.empty #add{width:46px;height:46px;flex:0 0 46px;border-radius:16px;background:linear-gradient(135deg,#42b5f5 0%,#39c7c0 50%,#a8d88b 100%);color:#0f3346;box-shadow:0 0 0 0 rgba(57,199,192,.55);animation:beat 2.6s ease-in-out infinite}
body.empty #add .glyph{font-size:24px;font-weight:300}
body.empty #tail{margin-top:0}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(57,199,192,.5)}50%{box-shadow:0 0 0 9px rgba(57,199,192,0)}}
@media (prefers-reduced-motion:reduce){body.empty #add{animation:none;box-shadow:0 0 0 4px rgba(57,199,192,.25)}}
</style></head><body>
<div id="pill">
  <div id="grip" title="Drag to move"><i></i><i></i><i></i></div>
  <div id="spots"></div>
  <div id="tail">
    <button class="spot" id="add" title="Add an app to the panel"><span class="glyph">＋</span></button><button class="spot" id="flick" title="Find anything (⌥Space)"><span class="glyph">⌕</span></button>
    
  </div>
</div>
<form id="group-ask" hidden><input id="group-name" maxlength="40" placeholder="Name this group" autocomplete="off" aria-label="Group name"></form>
<script src="pill.js"></script>
</body></html>
