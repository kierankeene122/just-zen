<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><style>
html,body{margin:0;background:transparent;overflow:hidden;height:100%;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif}
button{position:absolute;top:4px;height:36px;border-radius:18px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 6px 16px -6px rgba(20,30,40,.55);transition:transform .15s,opacity .15s}
button:hover{transform:scale(1.05)}
#b{left:4px;width:36px;gap:7px;background:linear-gradient(135deg,#42b5f5 0%,#39c7c0 50%,#a8d88b 100%);color:#0f3346;padding:0 12px 0 10px;box-sizing:border-box}
body[data-labelled=true] #b{width:auto}
#b span{display:none;white-space:nowrap;letter-spacing:.2px}body[data-labelled=true] #b span{display:inline}
#x{right:4px;width:36px;font:20px/1 -apple-system,BlinkMacSystemFont,sans-serif;background:rgba(255,255,255,.9);color:#3a4553;border:1px solid rgba(60,70,80,.18);opacity:.9}
body[data-theme=dark] #x{background:rgba(29,34,30,.9);border-color:rgba(255,255,255,.12);color:#d8ded4}
svg{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
</style></head><body><button id="b" title="Find an app for this pane"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8 17 17"/></svg><span>Find an app</span></button><button id="x" title="Close this tab and choose another app">×</button><script src="pane-badge.js"></script></body></html>
