<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><style>
html,body{margin:0;background:transparent;overflow:hidden;height:100%;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif}
/* One pill: a clear drag handle on the left, then find, move, close. */
#pill{position:absolute;left:2px;top:2px;height:40px;display:flex;align-items:center;gap:4px;padding:0 4px 0 0;border-radius:20px;background:rgba(255,255,255,.94);border:1px solid rgba(60,70,80,.2);box-shadow:0 8px 20px -8px rgba(20,30,40,.55);box-sizing:border-box}
body[data-theme=dark] #pill{background:rgba(29,34,30,.94);border-color:rgba(255,255,255,.14)}
#g{width:26px;height:38px;border-radius:19px 6px 6px 19px;cursor:grab;display:grid;grid-template-columns:repeat(2,4px);grid-template-rows:repeat(3,4px);gap:3px;place-content:center;background:rgba(60,70,80,.08);color:#3a4553;user-select:none;-webkit-user-select:none;flex:0 0 26px}
#g i{display:block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
#g:hover{background:rgba(59,141,180,.18)}#g:hover i{opacity:.9}#g:active{cursor:grabbing;background:rgba(59,141,180,.3)}
body[data-theme=dark] #g{background:rgba(255,255,255,.08);color:#d8ded4}
button{height:32px;border-radius:16px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;background:transparent;color:#3a4553;transition:transform .12s,background .12s}
button:hover{background:rgba(60,70,80,.1)}body[data-theme=dark] button{color:#d8ded4}body[data-theme=dark] button:hover{background:rgba(255,255,255,.1)}
#b{width:32px;gap:7px;background:linear-gradient(135deg,#42b5f5 0%,#39c7c0 50%,#a8d88b 100%);color:#0f3346;padding:0;box-sizing:border-box}
body[data-labelled=true] #b{width:auto;padding:0 12px 0 10px}
#b span{display:none;white-space:nowrap;letter-spacing:.2px}body[data-labelled=true] #b span{display:inline}
#m{width:32px;font:17px/1 -apple-system,BlinkMacSystemFont,sans-serif}
#x{width:32px;font:20px/1 -apple-system,BlinkMacSystemFont,sans-serif}
svg{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
</style></head><body><div id="pill"><div id="g" title="Drag to move these buttons"><i></i><i></i><i></i><i></i><i></i><i></i></div><button id="b" title="Find an app for this pane"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8 17 17"/></svg><span>Find an app</span></button><button id="m" title="Move to the next pane (⌘⇧→)">⇄</button><button id="x" title="Close this tab and choose another app">×</button></div><script src="pane-badge.js"></script></body></html>
