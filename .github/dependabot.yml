version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting new releases so yanked or malicious versions surface first; patches (Electron security fixes) wait less.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    # One pull request per week for all minor and patch updates means one signed release per week, not one per dependency.
    groups:
      weekly-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init and analyze must be on the same version, so they are always updated together (majors included).
      codeql-action:
        patterns:
          - "github/codeql-action*"
      weekly-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
