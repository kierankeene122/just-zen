version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting new releases so yanked or malicious versions surface first; patches (Electron security fixes) wait less.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    groups:
      electron-runtime:
        patterns:
          - electron
          - electron-updater
          - electron-builder
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
