name: Dependency auto-release

# After "Security checks" passes on a Dependabot branch, merge it (patch and minor updates only),
# bump the app's patch version, tag it, and run the signed release workflow so the update reaches installed apps.
on:
  workflow_run:
    workflows: ["Security checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Find the open pull request for this branch
        id: pr
        run: |
          git fetch origin "$BRANCH"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Check for major version bumps
        id: check
        continue-on-error: true
        run: node .github/scripts/check-dependency-update.cjs "origin/$BRANCH"
      - name: Leave the pull request for manual review
        if: steps.check.outcome == 'failure'
        run: >-
          gh pr comment "${{ steps.pr.outputs.number }}"
          --body "Not auto-merged because this update crosses a major version. Review it manually. Merging it will not trigger a release until the next tag."
      - name: Merge
        if: steps.check.outcome == 'success'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch
      - name: Bump the patch version and tag
        if: steps.check.outcome == 'success'
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          version=$(npm version patch --no-git-tag-version)
          git commit -am "chore(release): $version"
          git tag "$version"
          git push origin main "$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
  release:
    needs: merge
    if: needs.merge.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.merge.outputs.tag }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
