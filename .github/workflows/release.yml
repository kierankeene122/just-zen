name: Release signed macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to release (for example v0.3.1)
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    # Only the signing and notarization secrets are accepted; callers pass them explicitly.
    secrets:
      RELEASES_TOKEN:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Releases are published to the separate public releases repository, which needs a token that can write there.
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      HEARTH_GITHUB_OWNER: ${{ vars.HEARTH_GITHUB_OWNER }}
      HEARTH_GITHUB_REPO: ${{ vars.HEARTH_GITHUB_REPO }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Require signed-release configuration
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          test -n "$HEARTH_GITHUB_OWNER"
          test -n "$HEARTH_GITHUB_REPO"
          test -n "$GH_TOKEN"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_CONTENT"
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run rebuild
      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Create the GitHub release up front
        # electron-builder publishes each target in parallel; if the release does not exist yet, both create one and the tag ends up with two.
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          REPO="$HEARTH_GITHUB_OWNER/$HEARTH_GITHUB_REPO"
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --title "Just Zen $TAG" --notes "Signed and notarized macOS build for Apple silicon. Installed copies update automatically."
      - run: npm run dist:publish
      - name: Publish a stable download name for the website
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          cp release/Just-Zen-*-arm64.dmg release/Just-Zen-arm64.dmg
          gh release upload "$TAG" release/Just-Zen-arm64.dmg -R "$HEARTH_GITHUB_OWNER/$HEARTH_GITHUB_REPO" --clobber
      - name: Attest released installers
        # Build provenance is not offered on user-owned private repositories; it switches on if the repository becomes public or moves to an organisation.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
