name: Release signed macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to release (for example v0.3.1)
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    # Only the signing and notarization secrets are accepted; callers pass them explicitly.
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEARTH_GITHUB_OWNER: ${{ vars.HEARTH_GITHUB_OWNER }}
      HEARTH_GITHUB_REPO: ${{ vars.HEARTH_GITHUB_REPO }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Require signed-release configuration
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          test -n "$HEARTH_GITHUB_OWNER"
          test -n "$HEARTH_GITHUB_REPO"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_CONTENT"
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run rebuild
      - name: Bundle the Node.js runtime for the sandbox supervisor and document worker
        run: |
          mkdir -p build
          cp "$(node -p 'process.execPath')" build/node
          chmod +x build/node
          build/node -v
      - name: Record build information, including the Electron support window
        run: |
          node -e "(async()=>{const v=require('electron/package.json').version;let s=null;try{s=await require('./scripts/electron-support.cjs').electronSupport(v);}catch{}require('fs').writeFileSync('build/build-info.json',JSON.stringify({electron:v,app:require('./package.json').version,builtAt:new Date().toISOString(),electronSupport:s}));})()"
          cat build/build-info.json
      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Create the GitHub release up front
        # electron-builder publishes each target in parallel; if the release does not exist yet, both create one and the tag ends up with two.
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          REPO="$HEARTH_GITHUB_OWNER/$HEARTH_GITHUB_REPO"
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --title "Just Zen $TAG" --notes "Signed and notarized macOS build for Apple silicon. Installed copies update automatically."
      - run: npm run dist:publish
      - name: Publish a stable download name for the website
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          cp release/Just-Zen-*-arm64.dmg release/Just-Zen-arm64.dmg
          gh release upload "$TAG" release/Just-Zen-arm64.dmg -R "$HEARTH_GITHUB_OWNER/$HEARTH_GITHUB_REPO" --clobber
      - name: Attest released installers
        # Build provenance is only offered on public repositories.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
